<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>zero — Links</title>

    <link
        rel="icon"
        href="assets/profile.jpg"
        type="image/jpeg"
    >

    <meta
        name="theme-color"
        content="#f5f5f3"
    >

    <meta
        property="og:title"
        content="zero — Links"
    >

    <meta
        property="og:description"
        content="Explore zero's links."
    >

    <meta
        property="og:image"
        content="assets/profile.jpg"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="zero — Links"
    >

    <meta
        name="twitter:description"
        content="Explore zero's links."
    >

    <meta
        name="twitter:image"
        content="assets/profile.jpg"
    >

    <link
        rel="stylesheet"
        href="platforms.css"
    >

</head>


<body>

    <main class="links-page">


        <!-- PROFILE -->

        <a
            href="index.html"
            class="profile-header page-link"
        >

            <div class="profile-image">

                <img
                    src="assets/profile.jpg"
                    alt="Zero"
                >

            </div>


            <div class="profile-info">

                <div class="username">

                    <span>zero</span>

                    <span class="verified">
                        ✓
                    </span>

                </div>


                <p>
                    @zero
                </p>


                <span class="tagline">
                    Creating beyond limits.
                </span>

            </div>


            <span class="back-arrow">
                ←
            </span>

        </a>



        <!-- ACTIONS -->

        <div class="profile-actions">


            <!-- SHARE -->

            <button
                type="button"
                class="action-btn"
                id="shareBtn"
                aria-label="Share Zero's links"
            >

                <span class="action-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="18"
                            cy="5"
                            r="2.2"
                        ></circle>

                        <circle
                            cx="6"
                            cy="12"
                            r="2.2"
                        ></circle>

                        <circle
                            cx="18"
                            cy="19"
                            r="2.2"
                        ></circle>

                        <path
                            d="M8 11l7.8-4.5"
                        ></path>

                        <path
                            d="M8 13l7.8 4.5"
                        ></path>

                    </svg>

                </span>

                <span>
                    Share
                </span>

            </button>



            <!-- COPY -->

            <button
                type="button"
                class="action-btn"
                id="copyBtn"
                aria-label="Copy Zero's link"
            >

                <span
                    class="action-icon"
                    id="copyIcon"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="8"
                            y="8"
                            width="11"
                            height="11"
                            rx="2"
                        ></rect>

                        <path
                            d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                        ></path>

                    </svg>

                </span>

                <span id="copyText">
                    Copy
                </span>

            </button>



            <!-- QR -->

            <button
                type="button"
                class="action-btn"
                id="qrBtn"
                aria-label="Show QR code"
            >

                <span class="action-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="3"
                            width="7"
                            height="7"
                        ></rect>

                        <rect
                            x="14"
                            y="3"
                            width="7"
                            height="7"
                        ></rect>

                        <rect
                            x="3"
                            y="14"
                            width="7"
                            height="7"
                        ></rect>

                        <path
                            d="M14 14h3v3h-3z"
                        ></path>

                        <path
                            d="M18 18h3v3h-3z"
                        ></path>

                        <path
                            d="M17 14h4"
                        ></path>

                        <path
                            d="M14 18v3"
                        ></path>

                    </svg>

                </span>

                <span>
                    QR
                </span>

            </button>

        </div>



        <!-- QR PANEL -->

        <section
            class="qr-panel"
            id="qrPanel"
            aria-hidden="true"
        >

            <div class="qr-header">

                <span
                    aria-hidden="true"
                ></span>


                <button
                    type="button"
                    class="qr-close"
                    id="qrClose"
                    aria-label="Close QR code"
                >
                    ×
                </button>

            </div>


            <div class="qr-code">

                <img
                    id="qrImage"
                    src=""
                    alt="QR code for Zero's links"
                >

            </div>

        </section>



        <!-- ONLINE PLATFORMS -->

        <section class="platforms-box">

            <div class="platforms-title">
                ONLINE
            </div>



            <!-- FACEBOOK -->

            <a
                href="https://www.facebook.com/share/1CXATNYzDx/"
                class="platform"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="platform-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v3H6v4h3v5h4v-5h3l1-4h-4V9c0-.6.4-1 1-1Z"></path>

                    </svg>

                </div>


                <div class="platform-info">
                    <strong>Facebook</strong>
                </div>


                <span class="arrow">
                    ↗
                </span>

            </a>



            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/z.er0day?stkn=MWJxcWFwbWdudng1dw=="
                class="platform"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="platform-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                        ></rect>

                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                        ></circle>

                        <circle
                            cx="17.5"
                            cy="6.5"
                            r="1"
                        ></circle>

                    </svg>

                </div>


                <div class="platform-info">
                    <strong>Instagram</strong>
                </div>


                <span class="arrow">
                    ↗
                </span>

            </a>



            <!-- TIKTOK -->

            <a
                href="https://www.tiktok.com/@z.er0luck?_r=1&_t=ZS-99s0cFkpZpp"
                class="platform"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="platform-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M14 4V15.5C14 17.43 12.43 19 10.5 19C8.57 19 7 17.43 7 15.5C7 13.57 8.57 12 10.5 12C11.03 12 11.54 12.12 12 12.34"></path>

                        <path d="M14 4C14.4 6.2 15.8 7.6 18 8"></path>

                    </svg>

                </div>


                <div class="platform-info">
                    <strong>TikTok</strong>
                </div>


                <span class="arrow">
                    ↗
                </span>

            </a>



            <!-- WHATSAPP -->

            <a
                href="https://wa.me/qr/A6TDR2RGMDMBP1"
                class="platform"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="platform-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"></path>

                        <path d="M9 8.5c.3-.5.6-.5.9-.1l.8 1c.2.3.2.5 0 .8l-.5.6c.6 1.1 1.5 2 2.6 2.6l.6-.5c.3-.2.5-.2.8 0l1 .8c.4.3.4.6-.1.9-.6.4-1.2.5-1.8.3-1.8-.5-4.2-2.9-4.7-4.7-.2-.6-.1-1.2.4-1.7Z"></path>

                    </svg>

                </div>


                <div class="platform-info">
                    <strong>WhatsApp</strong>
                </div>


                <span class="arrow">
                    ↗
                </span>

            </a>



            <!-- TELEGRAM -->

            <a
                href="https://t.me/zer00luck"
                class="platform"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="platform-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M21 4L3.8 10.7c-.8.3-.8 1.1-.1 1.3l4.4 1.4 1.7 5.3c.2.7.6.7 1 .3l2.5-2.5 4.7 3.5c.6.4 1 .1 1.2-.6L21.9 5c.2-.9-.3-1.3-.9-1Z"></path>

                        <path d="M8.1 13.4L18 7.2"></path>

                    </svg>

                </div>


                <div class="platform-info">
                    <strong>Telegram</strong>
                </div>


                <span class="arrow">
                    ↗
                </span>

            </a>

        </section>



        <!-- FOOTER -->

        <footer class="footer">
            © 2026 zero. All rights reserved.
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
