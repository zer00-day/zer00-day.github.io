<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>zero — Links</title>

    <link
        rel="icon"
        href="assets/profile.jpg"
        type="image/jpeg"
    >

    <meta
        name="theme-color"
        content="#f5f5f3"
    >

    <script>
        (() => {
            try {
                const savedTheme = localStorage.getItem("zero-theme");

                if (savedTheme === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (error) {
            }
        })();
    </script>

    <meta
        property="og:title"
        content="zero — Links"
    >

    <meta
        property="og:description"
        content="Explore zero's links."
    >

    <meta
        property="og:image"
        content="assets/profile.jpg"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="zero — Links"
    >

    <meta
        name="twitter:description"
        content="Explore zero's links."
    >

    <meta
        name="twitter:image"
        content="assets/profile.jpg"
    >

    <link
        rel="stylesheet"
        href="platforms.css"
    >

    <style>
        .about-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 58px;
            box-sizing: border-box;
            margin-top: 14px;
            padding: 0 20px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            color: var(--text-strong);
            text-decoration: none;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.025);
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .about-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-strong);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.06);
        }

        .about-card:active {
            transform: translateY(0);
        }

        .about-card:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        .about-card-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .about-card-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: var(--text-soft);
            font-size: 17px;
            transition:
                color 0.25s ease,
                transform 0.25s ease,
                background 0.25s ease;
        }

        .about-card:hover .about-card-arrow {
            color: var(--text-strong);
            transform: translateX(2px);
            background: var(--surface);
        }

        .portfolio-platform .platform-icon {
            font-size: 0;
        }

        .portfolio-platform .platform-icon svg {
            width: 19px;
            height: 19px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .portfolio-platform .platform-info strong {
            font-weight: 650;
        }

        .theme-toggle-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 17px;
            height: 17px;
        }

        .theme-toggle-icon svg {
            display: block;
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle-icon .sun-icon {
            display: none;
        }

        html[data-theme="dark"] .theme-toggle-icon .moon-icon {
            display: none;
        }

        html[data-theme="dark"] .theme-toggle-icon .sun-icon {
            display: block;
        }

        @media (max-width: 380px) {
            .about-card {
                min-height: 54px;
                margin-top: 12px;
                padding: 0 17px;
                border-radius: 16px;
            }

            .about-card-title {
                font-size: 13px;
            }

            .about-card-arrow {
                width: 26px;
                height: 26px;
            }

            .portfolio-platform .platform-icon svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .about-card,
            .about-card-arrow {
                transition: none;
            }
        }
    </style>

</head>


<body>

    <main class="links-page">


        <a
            href="index.html"
            class="profile-header page-link"
        >

            <div class="profile-image">

                <img
                    src="assets/profile.jpg"
                    alt="Zero"

            </div>


            <div class="profile-info">

                <div class="username">

                    <span>zero</span>

                    <span class="verified">
                        ✓
                    </span>

                </div>


                <p>
                    @zero
                </p>


                <span class="tagline">
                    Creating beyond limits.
                </span>

            </div>


            <span class="back-arrow">
                ←
            </span>

        </a>


        <a
            href="about.html"
            class="about-card"
        >

            <span class="about-card-title">
                About Zero
            </span>

            <span
                class="about-card-arrow"
                aria-hidden="true"
            >
                →
            </span>

        </a>


        <div class="profile-actions">


            <button

                <span>
                    Share

            <button
                type="button"
                class="action-btn"
                id="copyBtn"
                aria-label="Copy Zero's link"
            >

                        viewBox="0 0 24 24"

            </button>


            <button

                class="action-btn"
                id="qrBtn"
                aria-label="Show QR code"
            >

                <span class="action-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect

                            y="3"
                            width="7"
                            height="7"
                        ></rect>

                        <rect
                            x="14"
                            y="3"
                            width="7"
                            height="7"
                        ></rect>

                        <rect
                            x="3"
                            y="14"
                            width="7"

                        <path

                </span>

                <span>
                    QR

            </button>

        </div>


        <div class="theme-toggle-row">

            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Switch to dark mode"
                aria-pressed="false"
                title="Switch to dark mode"
            >

                <span
                    class="theme-toggle-icon"
                    aria-hidden="true"
                >

                    <svg
                        class="moon-icon"
                        viewBox="0 0 24 24"

                        <path d="M17.66 17.66l1.41 1.41"></path>

                        <path d="M4.93 19.07l1.41-1.41"></path>
                        <path d="M17.66 6.34l1.41-1.41"></path>

                    </svg>

                </span>

            </button>

        </div>


        <section

            id="qrPanel"
            aria-hidden="true"
        >

            <div class="qr-header">

                <span aria-hidden="true"></span>

                <button
                    type="button"
                    class="qr-close"
                    id="qrClose"
